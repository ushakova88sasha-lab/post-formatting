name: Deploy to VPS

on:
  push:
    branches:
      - cursor/telegram-admin-panel-684e
  workflow_dispatch:

jobs:
  # Деплой не должен запускаться, если тесты не проходят - иначе на проде
  # оказывается заведомо сломанный код (именно так уже случалось).
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest -r tests_e2e/requirements.txt
          playwright install --with-deps chromium

      - name: Run backend tests
        env:
          TELEGRAM_BOT_TOKEN: "test-token"
          TELEGRAM_CHANNEL_ID: "@test_channel"
          ADMIN_USERNAME: "admin"
          ADMIN_PASSWORD: "test-password"
          SESSION_SECRET: "test-session-secret-32-characters-long"
        run: pytest -q

      - name: Run browser formatting tests
        run: pytest tests_e2e -v

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          password: ${{ secrets.VPS_SSH_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            set -e
            BRANCH="cursor/telegram-admin-panel-684e"
            APP_DIR=/opt/post-formatting

            cd "$APP_DIR"
            git fetch origin
            # На сервере не должно быть незакоммиченных правок — деплой всегда
            # приводит рабочую копию к состоянию ветки в git, а не мержит.
            git checkout -f "$BRANCH"
            git reset --hard "origin/$BRANCH"

            source venv/bin/activate
            pip install -q -r requirements.txt

            systemctl restart telegram-admin
            systemctl is-active telegram-admin
            sleep 2
            curl -fsS http://127.0.0.1:8000/health

            echo "Deployed $BRANCH at $(git rev-parse --short HEAD)"
